<!doctype html>
<!-- Fixture: rigged so the STRUCTURE check must fail, and only that one. Two
     h1s, a skipped heading level, no landmarks, and a target well under 44px —
     four structure defects in one file, because they share a measurement. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floor fixture — clean</title>
<style>
:root {
  --ink: #111111;
  --paper: #ffffff;
  --line: #d4d4d4;
  --space-4: 16px;
  --space-6: 24px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink);
       font: 16px/1.5 system-ui, sans-serif; }
main { padding: var(--space-4); max-width: 100%; }
.card { padding: var(--space-6); border: 1px solid var(--line); }
a, button { display: inline-block; min-height: 48px; min-width: 48px;
            line-height: 48px; color: var(--ink); background: var(--paper);
            border: 1px solid var(--line); }
</style></head>
<body>
<div id="main">
  <h1>First title</h1>
  <h1>Second title</h1>
  <h3>Skipped a level</h3>
  <div class="card" data-measure>
    <p>Body copy at a readable contrast ratio, inside a padded container.</p>
  </div>
  <button type="button" style="min-height:20px;min-width:20px;line-height:20px">x</button>
</div>
</body></html>
