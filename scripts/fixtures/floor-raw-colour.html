<!doctype html>
<!-- Fixture: rigged so the TOKEN check must fail, and only that one. One
     declaration below :root carries a literal colour instead of a token — and
     the literal is the SAME VALUE the token holds, so nothing renders
     differently and no other check can see it. This case needs no renderer, so
     it is the one floor check provable on any machine. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floor fixture — clean</title>
<style>
:root {
  --ink: #111111;
  --paper: #ffffff;
  --line: #d4d4d4;
  --space-4: 16px;
  --space-6: 24px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink);
       font: 16px/1.5 system-ui, sans-serif; }
main { padding: var(--space-4); max-width: 100%; }
.card { padding: var(--space-6); border: 1px solid #d4d4d4; }
a, button { display: inline-block; min-height: 48px; min-width: 48px;
            line-height: 48px; color: var(--ink); background: var(--paper);
            border: 1px solid var(--line); }
</style></head>
<body>
<header><nav><a href="#main">Skip to content</a></nav></header>
<main id="main">
  <h1>Raw colour below the token layer</h1>
  <h2>A section</h2>
  <div class="card" data-measure>
    <p>Body copy at a readable contrast ratio, inside a padded container.</p>
  </div>
  <button type="button">Press</button>
</main>
<footer><p>Footer</p></footer>
</body></html>
