<!doctype html>
<!-- Fixture: rigged so the PADDING check must fail, and only that one. The card
     declares padding on all sides; the column is given a fixed height its own
     content cannot fit, so the last child renders past the bottom padding edge
     with no margin to explain it. A stylesheet scan sees correct, token-derived
     padding; only a rendered measurement sees it gone. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floor fixture — padding lost at render</title>
<style>
:root {
  --ink: #111111;
  --paper: #ffffff;
  --line: #d4d4d4;
  --space-4: 16px;
  --space-6: 24px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink);
       font: 16px/1.5 system-ui, sans-serif; }
main { padding: var(--space-4); max-width: 100%; }
.card { padding: var(--space-6); border: 1px solid var(--line);
        height: 72px; display: flex; flex-direction: column; overflow: hidden; }
.card p { margin: 0; flex: none; }
a, button { display: inline-block; min-height: 48px; min-width: 48px;
            line-height: 48px; color: var(--ink); background: var(--paper);
            border: 1px solid var(--line); }
</style></head>
<body>
<header><nav><a href="#main">Skip to content</a></nav></header>
<main id="main">
  <h1>Padding lost at render</h1>
  <h2>A section</h2>
  <div class="card" data-measure>
    <p>First line.</p>
    <p>Pinned flush to the bottom padding edge.</p>
  </div>
  <button type="button">Press</button>
</main>
<footer><p>Footer</p></footer>
</body></html>
